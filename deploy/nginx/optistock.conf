# Nginx du serveur (hôte) → conteneur web d'OptiStock, réservé au VPN WireGuard.
# Remplacer WG_IP à l'installation (voir DEPLOIEMENT.md).
map $http_upgrade $optistock_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen WG_IP:80;
    server_name _;

    # Photos justificatives (jusqu'à ~28 Mo par entrée en stock)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Messagerie et notifications en temps réel (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $optistock_connection_upgrade;
        # L'entraînement du modèle IA peut durer jusqu'à 2 minutes.
        proxy_read_timeout 180s;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $optistock_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
